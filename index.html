<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cannonball — Fury of the Wasteland</title>
  <meta name="description" content="A wasteland road-war cannon game. Defend the last water rig, blast raiders, and fire yourself out of a cannon.">
  <meta name="theme-color" content="#2a120a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-armor">
        <span class="hud-ico">⛨</span>
        <div class="bar"><i id="hp-fill"></i></div>
        <b id="hp-num">100</b>
      </div>
      <div class="hud-mid">
        <div id="prog" class="prog"><div class="bar thin"><i id="prog-fill"></i></div><span id="prog-label"></span></div>
        <div id="boss-bar" hidden><span id="boss-name"></span><div class="bar boss"><i id="boss-fill"></i></div></div>
      </div>
      <div class="hud-scrap">⚙ <b id="scrap-num">0</b></div>
      <button id="btn-pause" class="hud-btn" aria-label="Pause">❚❚</button>
    </div>
    <div class="hud-bottom">
      <button id="btn-special" aria-label="Human Cannonball"><span class="skull">☠</span><span class="lbl">CANNONBALL</span></button>
      <div id="ammo-bar"></div>
    </div>
  </div>

  <div id="screens"></div>

  <noscript><p style="color:#fff;padding:2rem">Cannonball needs JavaScript to run.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
